title: Adelaide CSIT Graduate Research
description: Seminar calendar and resources for graduate research students in Computer Science and IT
url: https://ht-timchen.github.io
baseurl: /Adelaide-CSIT-GRC

markdown: kramdown
theme: null

exclude:
  - README.md
  - AGENTS.md
  - Doc
  - Seminar
  - schema
  - scripts
  - Gemfile
  - Gemfile.lock
  - .github
  - .gitignore

seminar_types:
  candidature_review:
    label: Candidature review
    badge: badge-review
  thesis_defence:
    label: Thesis defence (public seminar)
    badge: badge-defence
  hdr_seminar:
    label: GRS seminar
    badge: badge-hdr
  special:
    label: Special session
    badge: badge-special

thesis_types:
  - candidature_review
  - thesis_defence

hdr_series:
  id: hdr-2026
  title: "GRS Series 2026"
  description: |
    A recurring Graduate Research Student (GRS) seminar series for students to present
    progress, pilot ideas, and engage with peers and staff. Weekly sessions from July
    to November 2026 (Adelaide time). Schedule is tentative until speakers are confirmed.
