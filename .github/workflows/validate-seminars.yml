name: Validate seminars data

on:
  push:
    paths:
      - "_data/seminars.yml"
      - "schema/**"
      - "scripts/validate_seminars.py"
  pull_request:
    paths:
      - "_data/seminars.yml"
      - "schema/**"
      - "scripts/validate_seminars.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml jsonschema
      - name: Validate seminars.yml
        run: python3 scripts/validate_seminars.py
