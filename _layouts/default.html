<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Main">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/seminars' | relative_url }}"{% if page.title == 'Seminars' %} aria-current="page"{% endif %}>Seminars</a>
        <a href="{{ '/past-seminars' | relative_url }}"{% if page.title == 'Past seminars' %} aria-current="page"{% endif %}>Past seminars</a>
        <a href="https://github.com/ht-timchen/Adelaide-CSIT-GRC">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>School of Computer Science and IT, Adelaide University</p>
    <p>Times are shown in Adelaide local time (ACST/ACDT).</p>
  </footer>
</body>
</html>
