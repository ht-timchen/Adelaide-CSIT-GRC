  - id: candidature-review-2026-04-24-dahia
    type: candidature_review
    candidate: "Simranjeet Singh Dahia"
    supervisor: "Prof Claudia Szabo, Dr Ruslan Puscasu, Dr Azhar Iqbal"
    date: 2026-04-24
    time: "15:00"
    title: "Quantum multi-agent reinforcement learning for decision-making in complex systems"
    abstract: |
      Multi-agent reinforcement learning is a natural framework for decentralised decision-making in complex systems, but it faces persistent challenges under partial observability, strong inter-agent coupling and increasing coordination complexity. Quantum multi-agent reinforcement learning (QMARL) has recently emerged as a possible way to enhance policy and value representations in such settings. However, the field remains methodologically fragmented, is dominated by hybrid simulation-based studies and lacks both a consistent operational definition and disciplined evaluation standards. Our systematic review found that most existing work concentrates on encoding and policy approximation, while learning, coordination and evaluation remain underdeveloped.

      This PhD investigates QMARL as a representational framework rather than a computational speedup claim. We established a centralized-training, decentralized-execution QMARL pipeline, implemented matched quantum-classical benchmarking and introduced a Dec-POMDP calibration benchmark to test whether the framework can resolve non-classical correlation structure. Building on this foundation, ongoing experiments in cooperative MARL environments examine when quantum-parameterized actors and critics remain competitive and when stronger coordination regimes begin to expose representation-dependent behaviour. These findings motivate the next stage of the project: a complex phase space representation designed to explicitly encode coordination-relevant dynamics and a conflict-aware stabilisation mechanism for more expressive modelling of complex multi-agent dynamics.
    teams_url: "https://teams.microsoft.com/meet/4391590514779?p=ARWeFvAXrS5MG9hrZb"
    status: completed

  - id: candidature-review-2026-05-13-ye
    type: candidature_review
    candidate: "Ziyang Ye"
    supervisor: "Prof Olaf Maennel"
    date: 2026-05-13
    time: "10:00–11:00"
    title: "Towards Secure and Robust Visual Intelligence: Adversarial Robustness in Vision Foundation Models"
    abstract: |
      Vision Foundation Models are increasingly becoming the backbone of modern visual intelligence, enabling a wide range of systems to perceive, interpret, and reason about visual information. Their growing reuse across different applications brings significant benefits in generalisation and transferability, but it also introduces a new security concern: adversarial vulnerabilities may no longer be confined to individual models or isolated tasks. Instead, weaknesses in shared visual representations may transfer across model families and propagate through downstream systems, creating broader risks for the visual intelligence ecosystem.

      This research investigates the adversarial robustness of vision foundation models as a core AI security problem. It aims to understand how adversarial vulnerabilities emerge, how they transfer across different models and learning paradigms, and how they affect systems built upon shared visual backbones. It also examines whether current defence mechanisms are sufficient under stronger and more systematic evaluation, and explores the trade-off between improving robustness and preserving the generalisation capabilities that make foundation models valuable.

      Through a comparative and system-oriented methodology, this study will evaluate robustness at multiple levels, from foundation representations to downstream system behaviour, using a range of adversarial settings and defence strategies. The expected outcome is a more unified understanding of vulnerability propagation, defence limitations, and robustness–generalisation trade-offs, contributing to the development of more secure and reliable visual intelligence systems.
    teams_url: "https://teams.microsoft.com/meet/43679131191974?p=VNm7XZhoNDkqJ8DnhW"
    status: completed

  - id: candidature-review-2026-05-13-wang
    type: candidature_review
    candidate: "Chuhan Wang"
    supervisor: "Prof. Olaf Maennel and Prof. Ruidong Chang"
    date: 2026-05-13
    time: "13:00–14:00"
    title: "Towards Reliable Digital Twin State: Definition, Maintenance, and Use under Imperfect Sensing"
    abstract: |
      Digital Twin (DT) systems for the building environment promise continuous, model-based insight into the condition of buildings and infrastructure. However, the sensing data that drives these systems is noisy, intermittent, and heterogeneous and most existing frameworks respond by treating sensor observations directly as system state in practice. This leads to various instability: transient objects corrupt geometric models, sensor failures leave the state undefined, and residual uncertainty propagates unchecked to downstream monitoring and maintenance decisions etc.

      This research proposes a state-centric perspective for DT systems, in which system state is an explicitly defined, continuously maintained, and reliably construct from but not equate with sensor observations. A unified three-module framework is developed to address the full state lifecycle under imperfect sensing: (1) a geometric state definition module that infers persistent structural state from multi-temporal LiDAR point clouds and images, distinguishing permanent features from transient elements; (2) a state maintenance module that coordinates heterogeneous IoT sensor streams, identify sensor reliability, and resolves inter-sensor conflicts to produce a trusted Digital Twin state; (3) a decision module that formulates resource-constrained maintenance and sensing strategies, accounting for residual state uncertainty.

      The framework is validated using data from an ARC-funded large-scale IoT deployment across residential buildings, providing real-world conditions of sensing noise, heterogeneity, and long-term operation. Expected contributions include a conceptual framework for state-centric Digital Twins, and an empirically validated system demonstrating practical deployability. This research addresses a cross-domain gap identified across geometric modeling, multi-sensor integration, and reliability-aware decision-making literature.
    teams_url: "https://teams.microsoft.com/l/meetup-join/19%3ameeting_MjgwN2FkZDYtZGIyZC00YTYwLThkNmEtZGNlMGI1MTI3MjAw%40thread.v2/0?context=%7b%22Tid%22%3a%22b3cddf40-9654-4a26-86a1-779c51f69c48%22%2c%22Oid%22%3a%2268661114-00d5-44f4-9e15-a3dc292001b2%22%7d"
    location: "Ingkarni Wardli 4.63 (IW 4.63) — also available via Teams"
    status: completed

  - id: special-2026-05-29-kim
    type: special
    title: "Connecting Intelligences beyond Boundaries"
    speaker: "Dr Dooyoung Kim, La Trobe University"
    date: 2026-05-29
    time: "16:00–17:00"
    location: "Online (Zoom)"
    abstract: |
      This talk explores how XR and spatial computing can connect people, AI, and memories beyond the boundaries of virtual and physical worlds, distance, and time. The presentation covers research on MR telepresence, virtual-physical integration, Physical AI and digital twins, and XRMemory systems for capturing, reconstructing, and replaying spatial experiences.

      Dr Dooyoung Kim is an incoming Lecturer in the Department of Computer Science and Information Technology at La Trobe University. He received his Ph.D. in Culture Technology from the KAIST UVR Lab, was a visiting postdoctoral researcher at New York University, and previously served as a Senior Researcher at the KAIST Augmented Reality Research Center. His research focuses on XR, spatial computing, and Human-Computer Interaction. He has received three ISMAR Best Paper Awards, an ACM CHI Honorable Mention Award, and has served as an organizer and session chair for IEEE VR and IEEE ISMAR.
    online_url: "https://adelaide.zoom.us/j/82640278384?pwd=cNirpf7n0fnXP3AGnbjcSdwiQ62Vm8.1"
    status: scheduled

  - id: special-2026-06-16-ml-universe
    type: special
    title: "Machine Learning Across the Universe"
    speaker: "Maja Jablonska"
    date: 2026-06-16
    time: "10:30"
    location: "AIML Atrium (in-person) and Zoom"
    image: "/assets/seminars/special-2026-06-16-ml-universe.jpg"
    image_alt: "AIML Research Seminar poster — Machine Learning Across the Universe, 16 June 10:30am, AIML Atrium. Speaker Maja Jablonska."
    abstract: |
      Astronomy and physics deal with various problems that can be excellently advanced by machine learning — most commonly due to enormous data volumes, computationally intensive forward models, and complex inference tasks involved. In this talk, Maja will provide an overview of the persistent challenges in astrophysics and highlight recent advances in applying machine learning, including spectral synthesis and analysis, mechanistic interpretability for testing the Platonic hypothesis in astronomical data, and hypothesis generation. She will also examine the limitations of current methods, with particular attention to factors that may hinder the broader adoption of machine learning in astrophysics.
    online_url: "https://adelaide.zoom.us/j/88930959358?pwd=cjBpt4b2U2D47mZLbI284RYbxzznqG.1"
    status: scheduled

  - id: candidature-review-2026-06-26-li
    type: candidature_review
    candidate: "Xiaoyang Li"
    supervisor: "Wei Zhang"
    date: 2026-06-26
    time: "10:30"
    title: "Time Series Forecasting under Data Heterogeneity"
    abstract: |
      Time series forecasting aims to predict future values or uncertainty from historical temporal observations, but real-world time series are often heterogeneous across time, data sources, and external modalities. This project investigates time series forecasting under data heterogeneity, focusing on three challenges: robustness under temporal distribution shift, generalization across structurally heterogeneous sources, and alignment of multimodal information with numerical time series. By developing heterogeneity-aware and uncertainty-aware forecasting methods, this project aims to support more robust, transferable, and interpretable forecasting in complex real-world settings.
    teams_url: "https://teams.microsoft.com/meet/43232849140610?p=FRBEJYKfrZFlE7rl7j"
    status: scheduled

  - id: special-2026-06-30-smart-cities
    type: special
    title: "Building Sustainable Smart Cities with AI-as-a-Service on Cloud and Edge Platforms"
    speaker: "Nguyen Huu Thanh and Nguyen Tai Hung, Advanced Networking and Smart Applications Laboratory (ANSA), School of Electrical and Electronic Engineering, Hanoi University of Science and Technology, Vietnam"
    date: 2026-06-30
    time: "10:30–11:15"
    location: "AIML Atrium (in-person) and Zoom"
    image: "/assets/seminars/special-2026-06-30-smart-cities.png"
    image_alt: "AIML Research Seminar — Building Sustainable Smart Cities with AI-as-a-Service on Cloud and Edge Platforms, 30 June 10:30am, AIML Atrium. Speakers Nguyen Huu Thanh and Nguyen Tai Hung."
    abstract: |
      Join us for a special AIML Research Seminar with Nguyen Huu Thanh and Nguyen Tai Hung from Hanoi University of Science and Technology as they explore how AI-as-a-Service, cloud-edge computing, and distributed AI are enabling the development of sustainable, intelligent smart cities through scalable, energy-efficient, and real-time AI solutions. In person at the AIML Atrium; morning tea provided.

      Artificial Intelligence (AI) is becoming a key enabler of digital transformation and smart city development. However, the rapid growth of AI applications generates unprecedented demands on computing, communication, and energy resources, raising important challenges related to scalability, latency, privacy, and sustainability. This talk presents cloud and edge computing infrastructures as a foundation for delivering sustainable AI services in smart city environments.

      In this talk, we first discuss emerging distributed AI paradigms, including federated learning, model parallelism, and hybrid parallelism, that enable AI training and inference across heterogeneous edge-cloud resources while reducing communication overhead and preserving data privacy. The concept of AI-as-a-Service is then introduced, integrating distributed AI, edge/cloud computing, and advanced communication networks to support dynamic provisioning of AI services. Attention is given to resource-aware orchestration, containerized service deployment, and energy-efficient management of computing resources.

      The talk further presents a recent research project on a real-world smart city case study involving large-scale traffic camera networks to illustrate how sustainable AI services can be deployed efficiently, achieving improved resource utilization, reduced energy consumption, and enhanced real-time performance.
    online_url: "https://adelaide.zoom.us/j/88930959358?pwd=cjBpt4b2U2D47mZLbI284RYbxzznqG.1"
    status: scheduled

  - id: thesis-defence-2026-07-15-pinero
    type: thesis_defence
    candidate: "Sindy Pinero"
    supervisor: "A/Prof Thuc Duy Le"
    date: 2026-07-15
    time: "09:20–10:00"
    title: "Causal Frameworks for Biomarker Discovery, Early Detection, and Drug Repurposing in Long COVID"
    abstract: |
      Post-Acute Sequelae of SARS-CoV-2 infection (PASC), commonly known as Long COVID, is a major global health challenge that affects a substantial proportion of individuals after infection and imposes high economic costs on healthcare systems and society. Despite extensive research, no disease-modifying therapy has received regulatory approval, and clinical care remains largely focused on symptoms. Progress has been slowed by three linked problems. First, the molecular signals reported across omics studies are difficult to interpret because association-based findings cannot reliably distinguish causal disease mechanisms from downstream responses or confounded correlates. Second, current diagnostic practice is retrospective and symptom-based, which limits the ability to identify high-risk individuals before persistent symptoms develop. Third, drug development pipelines treat safety as a downstream filter rather than a primary selection criterion, which is poorly suited to the heterogeneous, multimorbid populations affected by Long COVID.

      Addressing these problems requires moving from descriptive omics databases toward a coherent, causally aware analytical pipeline. The general aim of this thesis is to develop and apply computational frameworks that link omics evidence to causal biomarker discovery, presymptomatic risk prediction, and safety-first therapeutic deprioritisation on Long COVID. This aim is pursued through four objectives, each mapped to one of the above problems. The first objective focuses on the interpretability problem at the level of evidence from the literature, by establishing what is currently known from omics research on Long COVID and assessing the reliability of this evidence. The second objective continues to address the interpretability problem at the level of target discovery, by determining whether gene expression signatures can be linked to Long COVID susceptibility in a way that separates mechanistic drivers from downstream or confounded correlates. The third objective addresses the early-detection problem by testing whether early molecular profiles captured during acute infection can predict future Long COVID risk before symptom onset. The fourth objective addresses the safety problem in drug repurposing by developing a therapeutic deprioritisation framework that integrates causal target evidence with safety-first reasoning.

      To meet these objectives, this thesis develops four computational contributions. The first is a systematic critical review of 101 Long COVID omics studies that identify reproducible biological signals and articulate the methodological gaps that constrain translation. The second is MRCONTROL, an integrative framework that combines two complementary causal inference strategies to prioritise causal genes and stratify patients into transcriptomic endotypes. The third is TACO, a presymptomatic detection framework that combines causal feature selection with foundation-model classification to detect Long COVID at an early stage. The fourth is SPLIT, a drug repurposing framework that integrates three causal inference strategies with clinical knowledge graph learning to classify drug candidates based on predicted safety across different cohorts of Long COVID.

      Together, these contributions advance both the methodology and the translational evidence for Long COVID, providing causally grounded biomarkers, an early-detection model suitable for the acute infection window, and a phenotype-aware safety screening tool. The integrated workflow also provides a reusable template for other complex chronic conditions characterised by heterogeneity, comorbidity, and limited validated therapeutic targets.
    location: "Mawson Lakes, Building H, Level 1, Room 42"
    status: scheduled

  - id: thesis-defence-2026-07-16-zhang
    type: thesis_defence
    candidate: "Kaining Zhang"
    supervisor: "Prof Mark Billinghurst, Dr Theophilus Teo, Dr Allison Jing"
    date: 2026-07-16
    time: "15:20"
    title: "Decoding Input Preferences and Switch-Intention from Implicit Signals"
    abstract: |
      This thesis presents an implicit sensing framework for investigating how physiological and behavioural signals can be used to infer input preference and reported switch-intention in interaction tasks, with a focus on augmented reality (AR) interaction. Across three empirical studies, the thesis examines EEG-based differentiation between preferred and non-preferred hand-based input methods, validates EEG-based preference prediction in realistic AR interaction, and explores a multimodal implicit-signal method for predicting reported trial-level switch-intention using EEG, eye gaze, and head movement signals. This research provides methodological and design insights for developing more adaptive and user-centred AR interaction systems.
    location: "Mawson Lakes, Building H, Level 1, Room 42"
    status: scheduled

  - id: thesis-defence-2026-07-16-zhou
    type: thesis_defence
    candidate: "Gengze Zhou"
    supervisor: "A/Prof Qi Wu, Dr Yicong Hong"
    date: 2026-07-16
    time: "15:20"
    title: "Embodied World Knowledge for Vision-and-Language Navigation: Reasoning, Grounding, and Generalisation with Multimodal Large Language Models"
    abstract: |
      Vision-and-Language Navigation requires an embodied agent to interpret natural-language instructions, understand complex visual environments, reason about spatial relationships, and execute a sequence of actions to reach a target destination. Although substantial progress has been made, conventional navigation systems often rely on task-specific architectures and limited supervision, restricting their ability to generalise to unseen environments, instructions, and navigation objectives.

      This thesis investigates how multimodal large language models can equip embodied agents with richer world knowledge, stronger reasoning capabilities, and improved visual-language grounding. It introduces a series of methods that integrate pretrained vision-language representations, large language model reasoning, environmental memory, and navigation-specific action learning. These methods address key challenges including instruction understanding, object and landmark grounding, long-horizon planning, continuous-environment navigation, and generalisation across tasks and environments.

      The thesis also examines a broader agentic formulation of embodied navigation, in which high-level reasoning and planning are separated from low-level navigation execution. Within this framework, a general-purpose agent can interpret user goals, decompose complex tasks, maintain and retrieve relevant environmental evidence, and coordinate specialised navigation and perception components. This separation enables the reasoning layer to flexibly select behaviours, manage contextual information, and adapt the system to different tasks without requiring every capability to be incorporated into a single monolithic model.

      Overall, the research demonstrates that combining large-scale vision-language pretraining, explicit embodied alignment, structured memory, and agentic planning can substantially improve navigation performance, robustness, and generalisation. These findings provide a scalable foundation for developing general-purpose embodied agents capable of understanding instructions, reasoning about their surroundings, and acting effectively in complex simulated and real-world environments.
    location: "City East, Napier Building, 209 Lecture Theatre"
    status: scheduled

  - id: hdr-2026-07-27-series-01
    type: hdr_seminar
    series: hdr-2026
    session_number: 1
    title: "User Interfaces for AR: The Last Frontier – Us(ers)"
    speaker: "Prof Bruce H. Thomas"
    date: 2026-07-27
    time: "16:00–17:00"
    location: "CE: Ingkarni Wardli 5.57 (IW5.57); ML: Mawson Lakes Building J, J2-15"
    image: "/assets/seminars/hdr-2026-07-27-series-01.png"
    image_alt: "GRS Series talk banner — User Interfaces for AR: The Last Frontier – Us(ers). Speaker Prof Bruce H. Thomas."
    abstract: |
      User interfaces are the boundary between humans and Augmented Reality technology. These user interfaces incorporate the visual presentation of information, virtual controls for the applications, and physical devices to enhance users’ abilities to build a mental model that blends the physical world and the virtual world created for them. This is a very difficult problem to solve. Many smart scientists have investigated this problem for decades. This talk will investigate this research from the point of view of where we came from, where we are at the current moment, and possible future directions we could go. Part of this journey is a discussion of why this is a difficult problem. AR user interfaces are more difficult to design than traditional 2D desktops, handheld devices, and (I would argue) Virtual Reality interfaces. While AR user interfaces research is challenging, it is quite rewarding. The talk hopefully will motivate more researchers to investigate this topic.

      Professor Thomas is currently Emeritus Professor at the Adelaide University. His current research interests include the following: user interfaces, augmented reality, virtual reality, visualisation, wearable computers, CSCW, tabletop display interfaces, and the use of cognitive psychology in virtual environments research. He has served in many roles for the IEEE International Symposium on Mixed and Augmented Reality, IEEE Virtual Reality, and IEEE/ACM International Symposium on Wearable Computers, including program chair, general chair and on the steering committee. He also founded the ACM Interactive Surfaces and Spaces Conference (formerly IEEE Tabletop). He was awarded the ACM International Symposium on Wearable Computers (ISWC) 20-Year Impact Award. Prof. Thomas’ academic qualifications include the following: a BA in Physics from George Washington University, an MS in Computer Science from the University of Virginia, and a PhD in Computer Science from Flinders University.
    status: completed

  - id: hdr-2026-08-03-series-03
    type: hdr_seminar
    series: hdr-2026
    session_number: 2
    title: "Learning Beyond Parameters: Optimising Prompts, Programmes, Workflows and Algorithms in the LLM Era"
    speaker: "A/Prof Lingqiao Liu"
    date: 2026-08-03
    time: "16:00–17:00"
    location: "CE: Napier 108; ML: Mawson Lakes Building J, J2-15"
    image: "/assets/seminars/hdr-2026-08-03-series-03.png"
    image_alt: "Headshot of A/Prof Lingqiao Liu, speaker for the GRS Series talk Learning Beyond Parameters."
    abstract: |
      The rapid advancement of large language models is transforming not only AI applications, but also what it means for a system to learn. While conventional machine learning focuses on parameter optimisation, modern LLM-based systems expose many additional components that can be optimised, including prompts, programmes, workflows and even algorithms. This seminar examines this shift through three questions: what to learn, how to learn, and what new capabilities this enables. Representative approaches across prompt optimisation, programme optimisation, workflow search and algorithm discovery will be discussed alongside techniques such as textual feedback, evolutionary search, tree search and self-improving agents. We conclude by outlining open challenges and opportunities for building AI systems that can improve not only models but entire problem-solving processes.

      Lingqiao Liu is an Associate Professor at the School of Computer Science, The University of Adelaide, Australia, and an Academic Member of the Australian Institute for Machine Learning. He received the ARC DECRA (Discovery Early Career Researcher Award) in 2016 and the University of Adelaide Research Fellowship in the same year.

      His research spans machine learning, computer vision, and natural language processing, with the objective of building practical machine learning systems that are more data efficient and generalisable for real-world applications. His current major research topics include low-supervision machine learning (semi-supervised learning, unsupervised learning, few-shot and zero-shot learning), generalisable machine learning systems (domain generalisation, compositional generalisation), computer vision applications (dense prediction, fine-grained recognition, content generation), and natural language processing applications (low-resource NLP and generalisation of NLP systems).
    status: scheduled

  - id: candidature-review-2026-08-04-nguyen
    type: candidature_review
    candidate: "Nam Kha Nguyen"
    supervisor: "Wei Zhang"
    date: 2026-08-04
    time: "10:00–10:30"
    title: "Generative Supervision for Modality Alignment in Vision-Language Models"
    abstract: |
      Vision-language models align a frozen vision encoder to a language model using only a caption loss. Captions usually just describe the salient objects and omit texture, layout and fine attributes, so the encoder learns to discard the visual detail that many downstream tasks depend on. This project asks whether a generative model can supply a second, vision-grounded supervision signal during alignment which covers what the caption leaves out. It examines how such a signal should be built and conditioned so that it strengthens performance and the perception of visual detail, and then which kind of generative process delivers that signal most effectively.
    teams_url: "https://teams.microsoft.com/meet/410550131343629?p=iLmYf3KloIEJjomFcE"
    status: scheduled

  - id: special-2026-08-04-aiml-fischer
    type: special
    title: "Sensing Change: Brain-Inspired Navigation Beyond GPS"
    speaker: "Dr Tobias Fischer, Queensland University of Technology"
    date: 2026-08-04
    time: "14:30"
    location: "AIML Atrium (in-person) and Zoom"
    image: "/assets/seminars/special-2026-08-04-aiml-fischer.jpg"
    image_alt: "AIML Research Seminar poster — Sensing Change: Brain-Inspired Navigation Beyond GPS, Tuesday 4 August 2:30pm, AIML Atrium. Speaker Dr Tobias Fischer, QUT."
    abstract: |
      Knowing your location is fundamental to navigation - for humans, animals, and autonomous systems alike. But how can robots and other autonomous agents determine their position with confidence and precision in environments where satellite systems are unavailable or unreliable? The central theme of this talk explores Visual Place Recognition (VPR), which is the ability to recognise previously visited locations using only visual data. I will demonstrate how energy-efficient approaches using bio-inspired event-based cameras and spiking neural networks can provide low-power edge devices with location information with superior energy efficiency, adaptability, and data efficiency. Beyond this central theme, I will also touch on my work on underwater perception for reef restoration, and about Pixi, a powerful tool to run many robotics, computer vision, and AI libraries on any operating system (Linux, MacOS, Windows, or even your browser!).

      Dr Tobias Fischer is a Senior Lecturer and ARC DECRA Fellow at the Queensland University of Technology (QUT). His research spans neuromorphic computing, computer vision, and robotics, with a focus on robot localisation and underwater perception for resource-constrained autonomous systems. He has secured over $3 million in competitive research funding, including grants from Intel, Amazon, the Reef Restoration and Adaptation Program and a CRC-P with Emesent. Dr Fischer received his PhD from Imperial College London, where his thesis won the UK Best PhD in Robotics Award. He has published more than 70 papers in leading venues, including Science Robotics, IEEE Transactions on Robotics, IEEE Transactions on Pattern Analysis and Machine Intelligence, CVPR, ICCV, ECCV, ICRA, and IROS. He serves as an Associate Editor for leading robotics journals and conferences and co-chairs the IEEE Robotics and Automation Society Women in Engineering Committee. Website: https://www.tobiasfischer.info
    online_url: "https://adelaide.zoom.us/j/86998554108?pwd=hbMMO5S7Uz9skWAyHDfr1dpbWdG12t.1"
    status: scheduled

  - id: special-2026-08-04-ive-herr
    type: special
    title: "Introduction to the Future Ecologies Group"
    speaker: "Prof Christiane M Herr, Southern University of Science and Technology, Shenzhen, China"
    date: 2026-08-04
    time: "15:00"
    location: "City West, Jeffrey Smart Building, JS6-13"
    image: "/assets/seminars/special-2026-08-04-ive-herr.jpg"
    image_alt: "IVE Seminar poster — Introduction to the Future Ecologies Group, Tuesday 4 August 3pm. Speaker Prof Christiane M Herr, SUSTech."
    abstract: |
      The Future Ecologies Group at the SUSTech School of Design takes a cross-disciplinary research approach to develop new intersections of the natural and the artificial in future built environments. We employ technology as a platform to expand the range of architectural design, including the development of drone-building interfaces, designed ecosystems on buildings and the curation of building microbiomes. Future Ecologies research projects employ science and advanced technologies in the design of high-rise buildings for future high-density cities, including sustainable architectural technologies, structural and material aspects of green building design, integrated facades and new ecological models of artificial environments.

      Christiane M. Herr is a Professor, PhD supervisor, and Director of the BEng Industrial Design program at SUSTech. She leads the Future Ecologies Research Group, focusing on designed ecologies in high-density urban environments, digital design and technologies supporting new interfaces between natural and human-made systems. She holds a Dipl.-Ing., MArch, PhD, and a second Dr.-Ing. from the University of Kassel and The University of Hong Kong. Previously, she worked at Xian Jiaotong-Liverpool University, Shenzhen University, and National Cheng Kung University. She served as President of CAADRIA for four years and is now vice-chair of the CAADFutures Foundation. She is on the editorial boards of Journal of Architectural Computing, Construction Robotics, Sustainable Horizons and Architectural Intelligence with over 130 peer-reviewed publications. She co-edited Design Cybernetics: Navigating the New (Springer) with Thomas Fischer.
    online_url: "https://adelaide.zoom.us/j/82640278384?pwd=cNirpf7n0fnXP3AGnbjcSdwiQ62Vm8.1"
    status: scheduled

  - id: special-2026-08-07-ive-zhang
    type: special
    title: "Human–Building Interaction: Comfort, Cognition, Energy and Climate Resilience"
    speaker: "Dr Fan Zhang, Griffith University"
    date: 2026-08-07
    time: "14:00"
    location: "Online (Zoom)"
    image: "/assets/seminars/special-2026-08-07-ive-zhang.jpg"
    image_alt: "IVE Seminar poster — Human–Building Interaction: Comfort, Cognition, Energy and Climate Resilience, Friday 7 August 2pm, Zoom. Speaker Dr Fan Zhang, Griffith University."
    abstract: |
      The talk covers a research programme on healthy, comfortable, productive, low-carbon built environments. It starts with the tension between climate resilience, peak electricity demand and indoor environmental quality, then presents experimental evidence challenging the assumption that office performance peaks narrowly at 22°C. It draws on thermal-comfort experiments, cognitive testing, EEG, field monitoring, web mining and building-performance analysis to examine how temperature and IEQ affect comfort, cognition, satisfaction and energy use. It also introduces Dr Zhang's current work on integrated IEQ-energy evaluation, data-driven post-occupancy assessment, and DECRA research on thermal effects on office productivity, with particular attention to learning effects in repeated cognitive testing that may exceed apparent temperature effects. It concludes with implications for evidence-based design, sustainable retrofit, adaptive controls and climate-resilient building operation.

      Dr Fan Zhang is a senior lecturer and DECRA Fellow at Griffith University. PhD in architectural science from the University of Sydney, MSc in sustainable building technology from the University of Nottingham. Expertise covers thermal comfort and productivity, integrated IEQ-energy assessment, overheating and heat-health risk, sustainable retrofit, evidence-based and VR-enabled design evaluation, and occupant-centric adaptive building operation. She is associate editor for Frontiers in Built Environment (Indoor Environment section) and editorial board member for Indoor and Built Environment and Architecture. She was conference chair of the 57th International Conference of the Architectural Science Association (ANZAScA).
    online_url: "https://adelaide.zoom.us/j/82640278384?pwd=cNirpf7n0fnXP3AGnbjcSdwiQ62Vm8.1"
    status: scheduled

  - id: hdr-2026-08-10-series-04
    type: hdr_seminar
    series: hdr-2026
    session_number: 3
    title: "Learning Forever Across Varying Domains"
    speaker: "Naeem Paeedeh (student presentation)"
    date: 2026-08-10
    time: "16:00–17:00"
    location: "CE: Napier 108; ML: Mawson Lakes Building J, J2-15"
    abstract: |
      What if a neural network, the brain of an intelligence system, navigates an ever-changing world? While they can be trained to perform new tasks, they need to practice repeatedly or see a large number of samples. Moreover, as they continually learn new tasks, they forget most of the knowledge learned in past sessions. In this session, two novel methods will be discussed that help transformers efficiently learn new domains while preserving prior knowledge, without altering the networks' valuable original weights or storing any past samples. First, a novel method will be introduced that helps the network absorb both generalizable and shared knowledge across domains while also learning the nuances of each new domain. Second, a new method will be presented for an even more challenging setting of having a handful of samples by combining visual and linguistic knowledge of the world.

      Naeem is a PhD student in the School of Computer Science and IT. His research focuses on developing machine learning methods that enable neural networks to operate in dynamic environments with very limited labeled data. His interests are in few-shot learning, continual learning, domain adaptation, and vision-language models. He has developed transformer-based methods, the current dominant, most powerful yet data-hungry architecture of neural networks, to help them adapt rapidly from a few observations while becoming resilient to sudden and drastic shifts in the environment and to catastrophic forgetting.
    status: scheduled

  - id: hdr-2026-08-10-pathiranage
    type: hdr_seminar
    series: hdr-2026
    session_number: 3
    title: "On the Use of Bi-Objective Evolutionary Algorithms for the Stochastic Multiple Knapsack Problem under Dynamic Constraints"
    speaker: "Ishara Udayanthi Hewa Pathiranage (student presentation)"
    date: 2026-08-10
    time: "16:00–17:00"
    location: "CE: Napier 108; ML: Mawson Lakes Building J, J2-15"
    abstract: |
      The multiple knapsack problem (MKP) generalizes the classical knapsack problem by assigning items to multiple knapsacks subject to capacity constraints. It is used to model many real-world resource allocation and scheduling problems. In practice, these optimization problems often involve stochastic and dynamic components. Evolutionary algorithms provide a flexible framework for addressing such problems under uncertainty and dynamic changes. In this paper, we investigate a stochastic and dynamic variant of MKP with chance constraints, where the item weights are modeled as independent normally distributed random variables and knapsack capacities change during the optimization process. We formulate the problem as a bi-objective optimization formulation that balances profit maximization and probabilistic capacity satisfaction at a given confidence level. We conduct an empirical comparison of four widely used multi-objective evolutionary algorithms (MOEAs), representing both decomposition- and dominance-based search paradigms. The algorithms are evaluated under varying uncertainty levels, confidence thresholds, and dynamic change settings. The results provide comparative insights into the behavior of decomposition-based and dominance-based MOEAs for stochastic MKP under dynamic constraints.
    status: scheduled

  - id: special-2026-08-13-ive-hou
    type: special
    title: "Human–Environment Interactions in the Built Environment: From Healthy Ageing to Immersive Soundscape Research"
    speaker: "Dr Cynthia Hou, The Hong Kong Polytechnic University"
    date: 2026-08-13
    time: "10:00"
    location: "Catherine Helen Spence Building, City West Room CS 5-09"
    image: "/assets/seminars/special-2026-08-13-ive-hou.jpg"
    image_alt: "IVE Seminar poster — Human–Environment Interactions in the Built Environment: From Healthy Ageing to Immersive Soundscape Research, Thursday 13 August 10am. Speaker Dr Cynthia Hou."
    abstract: |
      Dr Cynthia Hou will present her research on human–environment interactions in the built environment, highlighting how interdisciplinary approaches can support healthier, safer, and more resilient living environments. Her work integrates environmental psychology, building science, immersive technologies, and artificial intelligence to understand how people perceive, interact with, and adapt to their surrounding environments.

      Dr Hou is an Assistant Professor in the Department of Building Environment and Energy Engineering at The Hong Kong Polytechnic University. Her research focuses on the interaction between humans and the built environment, particularly from the perspectives of architectural engineering and user management. Her recent research concentrates on three core areas: healthy aging from facilities management perspective, urban soundscape for healthy city, and user views on indoor and outdoor architectural environment design and service management. She has been published in journals such as Building and Environment, Energy and Buildings, Journal of Building Engineering, Applied Acoustics, Sustainable Cities and Society, and Engineering, Construction and Architectural Management.
