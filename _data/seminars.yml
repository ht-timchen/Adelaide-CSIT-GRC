  - id: hdr-2026-08-03-series-03
    type: hdr_seminar
    series: hdr-2026
    session_number: 2
    title: "Learning Beyond Parameters: Optimising Prompts, Programmes, Workflows and Algorithms in the LLM Era"
    speaker: "A/Prof Lingqiao Liu"
    date: 2026-08-03
    time: "16:00–17:00"
    location: "CE: Napier 108; ML: Mawson Lakes Building J, J2-15"
    image: "/assets/seminars/hdr-2026-08-03-series-03.png"
    image_alt: "Headshot of A/Prof Lingqiao Liu, speaker for the GRS Series talk Learning Beyond Parameters."
    abstract: |
      The rapid advancement of large language models is transforming not only AI applications, but also what it means for a system to learn. While conventional machine learning focuses on parameter optimisation, modern LLM-based systems expose many additional components that can be optimised, including prompts, programmes, workflows and even algorithms. This seminar examines this shift through three questions: what to learn, how to learn, and what new capabilities this enables. Representative approaches across prompt optimisation, programme optimisation, workflow search and algorithm discovery will be discussed alongside techniques such as textual feedback, evolutionary search, tree search and self-improving agents. We conclude by outlining open challenges and opportunities for building AI systems that can improve not only models but entire problem-solving processes.
    bio: |
      Lingqiao Liu is an Associate Professor at the School of Computer Science, The University of Adelaide, Australia, and an Academic Member of the Australian Institute for Machine Learning. He received the ARC DECRA (Discovery Early Career Researcher Award) in 2016 and the University of Adelaide Research Fellowship in the same year.

      His research spans machine learning, computer vision, and natural language processing, with the objective of building practical machine learning systems that are more data efficient and generalisable for real-world applications. His current major research topics include low-supervision machine learning (semi-supervised learning, unsupervised learning, few-shot and zero-shot learning), generalisable machine learning systems (domain generalisation, compositional generalisation), computer vision applications (dense prediction, fine-grained recognition, content generation), and natural language processing applications (low-resource NLP and generalisation of NLP systems).
    status: scheduled

  - id: candidature-review-2026-08-04-nguyen
    type: candidature_review
    candidate: "Nam Kha Nguyen"
    supervisor: "Wei Zhang"
    date: 2026-08-04
    time: "10:00–10:30"
    title: "Generative Supervision for Modality Alignment in Vision-Language Models"
    abstract: |
      Vision-language models align a frozen vision encoder to a language model using only a caption loss. Captions usually just describe the salient objects and omit texture, layout and fine attributes, so the encoder learns to discard the visual detail that many downstream tasks depend on. This project asks whether a generative model can supply a second, vision-grounded supervision signal during alignment which covers what the caption leaves out. It examines how such a signal should be built and conditioned so that it strengthens performance and the perception of visual detail, and then which kind of generative process delivers that signal most effectively.
    teams_url: "https://teams.microsoft.com/meet/410550131343629?p=iLmYf3KloIEJjomFcE"
    status: scheduled

  - id: special-2026-08-04-aiml-fischer
    type: special
    title: "Sensing Change: Brain-Inspired Navigation Beyond GPS"
    speaker: "Dr Tobias Fischer, Queensland University of Technology"
    date: 2026-08-04
    time: "14:30"
    location: "AIML Atrium (in-person) and Zoom"
    image: "/assets/seminars/special-2026-08-04-aiml-fischer.jpg"
    image_alt: "AIML Research Seminar poster — Sensing Change: Brain-Inspired Navigation Beyond GPS, Tuesday 4 August 2:30pm, AIML Atrium. Speaker Dr Tobias Fischer, QUT."
    abstract: |
      Knowing your location is fundamental to navigation - for humans, animals, and autonomous systems alike. But how can robots and other autonomous agents determine their position with confidence and precision in environments where satellite systems are unavailable or unreliable? The central theme of this talk explores Visual Place Recognition (VPR), which is the ability to recognise previously visited locations using only visual data. I will demonstrate how energy-efficient approaches using bio-inspired event-based cameras and spiking neural networks can provide low-power edge devices with location information with superior energy efficiency, adaptability, and data efficiency. Beyond this central theme, I will also touch on my work on underwater perception for reef restoration, and about Pixi, a powerful tool to run many robotics, computer vision, and AI libraries on any operating system (Linux, MacOS, Windows, or even your browser!).

      Dr Tobias Fischer is a Senior Lecturer and ARC DECRA Fellow at the Queensland University of Technology (QUT). His research spans neuromorphic computing, computer vision, and robotics, with a focus on robot localisation and underwater perception for resource-constrained autonomous systems. He has secured over $3 million in competitive research funding, including grants from Intel, Amazon, the Reef Restoration and Adaptation Program and a CRC-P with Emesent. Dr Fischer received his PhD from Imperial College London, where his thesis won the UK Best PhD in Robotics Award. He has published more than 70 papers in leading venues, including Science Robotics, IEEE Transactions on Robotics, IEEE Transactions on Pattern Analysis and Machine Intelligence, CVPR, ICCV, ECCV, ICRA, and IROS. He serves as an Associate Editor for leading robotics journals and conferences and co-chairs the IEEE Robotics and Automation Society Women in Engineering Committee. Website: https://www.tobiasfischer.info
    online_url: "https://adelaide.zoom.us/j/86998554108?pwd=hbMMO5S7Uz9skWAyHDfr1dpbWdG12t.1"
    status: scheduled

  - id: special-2026-08-04-ive-herr
    type: special
    title: "Introduction to the Future Ecologies Group"
    speaker: "Prof Christiane M Herr, Southern University of Science and Technology, Shenzhen, China"
    date: 2026-08-04
    time: "15:00"
    location: "City West, Jeffrey Smart Building, JS6-13"
    image: "/assets/seminars/special-2026-08-04-ive-herr.jpg"
    image_alt: "IVE Seminar poster — Introduction to the Future Ecologies Group, Tuesday 4 August 3pm. Speaker Prof Christiane M Herr, SUSTech."
    abstract: |
      The Future Ecologies Group at the SUSTech School of Design takes a cross-disciplinary research approach to develop new intersections of the natural and the artificial in future built environments. We employ technology as a platform to expand the range of architectural design, including the development of drone-building interfaces, designed ecosystems on buildings and the curation of building microbiomes. Future Ecologies research projects employ science and advanced technologies in the design of high-rise buildings for future high-density cities, including sustainable architectural technologies, structural and material aspects of green building design, integrated facades and new ecological models of artificial environments.

      Christiane M. Herr is a Professor, PhD supervisor, and Director of the BEng Industrial Design program at SUSTech. She leads the Future Ecologies Research Group, focusing on designed ecologies in high-density urban environments, digital design and technologies supporting new interfaces between natural and human-made systems. She holds a Dipl.-Ing., MArch, PhD, and a second Dr.-Ing. from the University of Kassel and The University of Hong Kong. Previously, she worked at Xian Jiaotong-Liverpool University, Shenzhen University, and National Cheng Kung University. She served as President of CAADRIA for four years and is now vice-chair of the CAADFutures Foundation. She is on the editorial boards of Journal of Architectural Computing, Construction Robotics, Sustainable Horizons and Architectural Intelligence with over 130 peer-reviewed publications. She co-edited Design Cybernetics: Navigating the New (Springer) with Thomas Fischer.
    online_url: "https://adelaide.zoom.us/j/82640278384?pwd=cNirpf7n0fnXP3AGnbjcSdwiQ62Vm8.1"
    status: scheduled

  - id: special-2026-08-07-ive-zhang
    type: special
    title: "Human–Building Interaction: Comfort, Cognition, Energy and Climate Resilience"
    speaker: "Dr Fan Zhang, Griffith University"
    date: 2026-08-07
    time: "14:00"
    location: "Online (Zoom)"
    image: "/assets/seminars/special-2026-08-07-ive-zhang.jpg"
    image_alt: "IVE Seminar poster — Human–Building Interaction: Comfort, Cognition, Energy and Climate Resilience, Friday 7 August 2pm, Zoom. Speaker Dr Fan Zhang, Griffith University."
    abstract: |
      The talk covers a research programme on healthy, comfortable, productive, low-carbon built environments. It starts with the tension between climate resilience, peak electricity demand and indoor environmental quality, then presents experimental evidence challenging the assumption that office performance peaks narrowly at 22°C. It draws on thermal-comfort experiments, cognitive testing, EEG, field monitoring, web mining and building-performance analysis to examine how temperature and IEQ affect comfort, cognition, satisfaction and energy use. It also introduces Dr Zhang's current work on integrated IEQ-energy evaluation, data-driven post-occupancy assessment, and DECRA research on thermal effects on office productivity, with particular attention to learning effects in repeated cognitive testing that may exceed apparent temperature effects. It concludes with implications for evidence-based design, sustainable retrofit, adaptive controls and climate-resilient building operation.

      Dr Fan Zhang is a senior lecturer and DECRA Fellow at Griffith University. PhD in architectural science from the University of Sydney, MSc in sustainable building technology from the University of Nottingham. Expertise covers thermal comfort and productivity, integrated IEQ-energy assessment, overheating and heat-health risk, sustainable retrofit, evidence-based and VR-enabled design evaluation, and occupant-centric adaptive building operation. She is associate editor for Frontiers in Built Environment (Indoor Environment section) and editorial board member for Indoor and Built Environment and Architecture. She was conference chair of the 57th International Conference of the Architectural Science Association (ANZAScA).
    online_url: "https://adelaide.zoom.us/j/82640278384?pwd=cNirpf7n0fnXP3AGnbjcSdwiQ62Vm8.1"
    status: scheduled

  - id: hdr-2026-08-10-series-04
    type: hdr_seminar
    series: hdr-2026
    session_number: 3
    title: "Learning Forever Across Varying Domains"
    speaker: "Naeem Paeedeh (student presentation)"
    date: 2026-08-10
    time: "16:00–17:00"
    location: "CE: Napier 108; ML: Mawson Lakes Building J, J2-15"
    abstract: |
      What if a neural network, the brain of an intelligence system, navigates an ever-changing world? While they can be trained to perform new tasks, they need to practice repeatedly or see a large number of samples. Moreover, as they continually learn new tasks, they forget most of the knowledge learned in past sessions. In this session, two novel methods will be discussed that help transformers efficiently learn new domains while preserving prior knowledge, without altering the networks' valuable original weights or storing any past samples. First, a novel method will be introduced that helps the network absorb both generalizable and shared knowledge across domains while also learning the nuances of each new domain. Second, a new method will be presented for an even more challenging setting of having a handful of samples by combining visual and linguistic knowledge of the world.
    bio: |
      Naeem is a PhD student in the School of Computer Science and IT. His research focuses on developing machine learning methods that enable neural networks to operate in dynamic environments with very limited labeled data. His interests are in few-shot learning, continual learning, domain adaptation, and vision-language models. He has developed transformer-based methods, the current dominant, most powerful yet data-hungry architecture of neural networks, to help them adapt rapidly from a few observations while becoming resilient to sudden and drastic shifts in the environment and to catastrophic forgetting.
    status: scheduled

  - id: hdr-2026-08-10-pathiranage
    type: hdr_seminar
    series: hdr-2026
    session_number: 3
    title: "On the Use of Bi-Objective Evolutionary Algorithms for the Stochastic Multiple Knapsack Problem under Dynamic Constraints"
    speaker: "Ishara Udayanthi Hewa Pathiranage (student presentation)"
    date: 2026-08-10
    time: "16:00–17:00"
    location: "CE: Napier 108; ML: Mawson Lakes Building J, J2-15"
    abstract: |
      The multiple knapsack problem (MKP) generalizes the classical knapsack problem by assigning items to multiple knapsacks subject to capacity constraints. It is used to model many real-world resource allocation and scheduling problems. In practice, these optimization problems often involve stochastic and dynamic components. Evolutionary algorithms provide a flexible framework for addressing such problems under uncertainty and dynamic changes. In this paper, we investigate a stochastic and dynamic variant of MKP with chance constraints, where the item weights are modeled as independent normally distributed random variables and knapsack capacities change during the optimization process. We formulate the problem as a bi-objective optimization formulation that balances profit maximization and probabilistic capacity satisfaction at a given confidence level. We conduct an empirical comparison of four widely used multi-objective evolutionary algorithms (MOEAs), representing both decomposition- and dominance-based search paradigms. The algorithms are evaluated under varying uncertainty levels, confidence thresholds, and dynamic change settings. The results provide comparative insights into the behavior of decomposition-based and dominance-based MOEAs for stochastic MKP under dynamic constraints.
    status: scheduled

  - id: special-2026-08-11-aiml-hengel
    type: special
    title: "Eyesight to the Blind"
    speaker: "Prof Anton van den Hengel"
    date: 2026-08-11
    time: "14:30–15:30"
    location: "AIML Atrium (in-person) and Zoom"
    image: "/assets/seminars/special-2026-08-11-aiml-hengel.jpg"
    image_alt: "AIML Research Seminar poster — Eyesight to the Blind. Speaker Prof Anton van den Hengel."
    abstract: |
      Can a machine learn to see before it has seen anything? This talk explores groundbreaking research showing how abstract procedural data gives AI the structural foundations for more efficient and capable learning.

      Transformers, like so many neural networks, are commonly initialised at random because we don't know what structure we actually want in the initial weights. Random initialisation is easy, and safe to the extent that it is unlikely to introduce unwanted bias. It represents a maximally unstructured starting point for gradient descent's search for the computational scaffolding it needs to begin learning semantics. This talk describes work showing that brief exposure to specific, abstract, procedurally generated data injects beneficial structural inductive biases directly into transformer weights before any semantic training begins. These biases are modular to the extent that they reside in identifiable architectural components, can be transferred independently, and compose across pretraining rules to jointly improve multiple capabilities. This process is modality-agnostic: a vision transformer warm-started on sequences of balanced brackets, and no images, gains +1.7% final performance on ImageNet-1k, outperforming baselines trained on visual synthetic data. We show that front-loading as little as 0.1% procedural tokens reduces the language modelling data budget by up to 45%. Pretraining on procedural data is thus far more effective than training on real data.
    online_url: "https://adelaide.zoom.us/j/82433965818?pwd=mcL9rxS5ByVi9ggTKRnQ4dOcVXhANY.1"
    status: scheduled

  - id: special-2026-08-12-rezatofighi
    type: special
    title: "Neuro-Symbolic AI for Visual Reasoning and Robotic Systems: Building Trustworthy Intelligence"
    speaker: "A/Prof Hamid Rezatofighi, Monash University"
    date: 2026-08-12
    time: "11:00–12:00"
    location: "Online (Zoom)"
    image: "/assets/seminars/special-2026-08-12-rezatofighi.jpg"
    image_alt: "Headshot of A/Prof Hamid Rezatofighi, Monash University."
    abstract: |
      Recent advances in vision-language and vision-language-action foundation models have transformed robotics, yet scaling neural models alone does not necessarily deliver the reasoning, interpretability, and safety assurance required for trustworthy autonomy.

      In this talk, I will present our research at Monash on neuro-symbolic AI, combining neural perception and grounding with explicit world representations, symbolic reasoning, and planning. I will briefly discuss our work on humanoid and human-centred robots and demonstrate this philosophy through our DARPA autonomous UAV system, which integrates perception, probabilistic world modelling, reasoning, and mission-level planning.

      I will then ask a deeper question: how far can neural scaling take us toward the reasoning required for embodied intelligence? Through VIEW2SPACE [ECCV’26], I will show limitations of state-of-the-art foundation models in multi-view visual reasoning, particularly as compositional complexity increases. I will conclude with our progression through HYDRA [ECCV’24], NAVER [ICCV’25], and MATA [ICLR’26] toward agentic neuro-symbolic visual reasoning that combines structured memory, explicit reasoning, specialised agents, and learned reasoning control.

      Dr. Hamid Rezatofighi is an Associate Professor in the Faculty of Information Technology at Monash University, Australia. His research spans computer vision, machine learning, robotics, and neuro-symbolic AI, with a particular focus on visual perception and reasoning for intelligent autonomous systems operating in complex, dynamic environments. His current research explores how neural foundation models can be integrated with symbolic reasoning and agentic planning to develop more capable, interpretable, and trustworthy embodied AI systems.

      Prior to joining Monash, he was awarded the prestigious Australian Government Endeavour Research Fellowship, supporting his research at Stanford University’s Vision and Learning Lab. He subsequently served as a Senior Research Fellow at the Australian Institute for Machine Learning (AIML), University of Adelaide, and received his PhD from the Australian National University in 2015. Dr. Rezatofighi has authored approximately 120 publications in top-tier venues across computer vision, machine learning, artificial intelligence, and robotics, attracting over 21,000 citations. His work on Generalized Intersection over Union (GIoU), introduced in 2019, has received over 9,300 citations and has been widely adopted in modern object detection systems.

      His research has attracted more than $18 million in competitive funding, including multiple DARPA projects (one as Lead PI) and an ARC Discovery Project as Lead CI. His research has been recognised through competitive awards including the U.S. Office of Naval Research Global-X Challenge Award as Lead PI, the Australian Government Endeavour Research Fellowship, and the Monash Faculty of IT Dean’s Award for Early Career Research Excellence.

      He is strongly committed to serving the international research community. Since 2020, he has regularly served as Area Chair or Lead Area Chair for major conferences including CVPR, NeurIPS, ECCV, ICCV, AAAI, and IJCAI. His broader community service includes Editor for IROS, Senior Associate Editor for IEEE Transactions on Image Processing, and Associate Editor for the Artificial Intelligence Journal and ICRA.
    online_url: "https://adelaide.zoom.us/j/88023516383?pwd=dSBIMRH4WfXhsWBIYv7qNbclpWvfbR.1"
    status: scheduled

  - id: special-2026-08-13-ive-hou
